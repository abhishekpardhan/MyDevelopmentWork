<template>
    <div class="slds-p-around_small">
        <p class="slds-text-heading_small slds-m-bottom_small">Report an iPhone issue</p>
        <lightning-input
            label="Full Name"
            name="customerName"
            value={form.customerName}
            required
            max-length="120"
            disabled={readOnly}
            onchange={handleChange}
        ></lightning-input>
        <lightning-input
            type="email"
            label="Email"
            name="customerEmail"
            value={form.customerEmail}
            required
            message-when-type-mismatch="Enter an email like name@domain.com."
            disabled={readOnly}
            onchange={handleChange}
        ></lightning-input>
        <lightning-input
            type="tel"
            label="Mobile Number"
            name="customerMobile"
            value={form.customerMobile}
            required
            max-length="40"
            disabled={readOnly}
            onchange={handleChange}
        ></lightning-input>
        <lightning-textarea
            label="Issue Description"
            name="issueDescription"
            value={form.issueDescription}
            required
            max-length="32000"
            placeholder="What is happening, and which iPhone model?"
            disabled={readOnly}
            onchange={handleChange}
        ></lightning-textarea>
    </div>
</template>
